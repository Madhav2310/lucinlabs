[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucin"
version = "0.1.3"
description = "Find what your AI agents can do that they shouldn't — before attackers do."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Madhav", email = "madhav@lucinlabs.com" },
]
keywords = ["ai", "agent", "security", "scanner", "mcp", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
# The behavioral (streaming anomaly) layer REQUIRES river for a validated
# Half-Space Trees backend. The pure-Python fallback in behavioral/streaming.py
# is UNVALIDATED (has a documented cold-start ranking pathology) and only warns-
# and-degrades when river is absent; install this extra for the real backend.
behavioral = [
    "river>=0.21",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]
dev = [
    "pytest",
    "ruff",
    "certifi",
    "numpy",
    "scikit-learn",
    "river",
    "Pillow",
    "pytest-cov>=5.0",
]

[project.scripts]
lucin = "lucin.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lucin"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "N802", "N803", "E701", "E402", "E731", "E741", "F401", "N812", "E702", "E722", "F601", "N814", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
